<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400" role="img" aria-label="Sentry42 — sentinel helmet">
  <title>Sentry42</title>
  <defs>
    <linearGradient id="s42-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1436"/>
      <stop offset="1" stop-color="#08070f"/>
    </linearGradient>
    <linearGradient id="s42-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3468"/>
      <stop offset=".55" stop-color="#16132c"/>
      <stop offset="1" stop-color="#0b0a18"/>
    </linearGradient>
    <filter id="s42-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="200" height="200" fill="url(#s42-bg)"/>

  <!-- helmet shell -->
  <polygon points="100,24 146,44 164,92 154,140 100,180 46,140 36,92 54,44"
           fill="url(#s42-metal)" stroke="rgba(255,255,255,.18)" stroke-width="1.2"/>

  <!-- facet lines -->
  <path d="M100 24 V96 M54 44 L44 92 M146 44 L156 92 M100 136 V180 M46 140 L82 146 M154 140 L118 146"
        fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1.2"/>

  <!-- chevron visor -->
  <polygon points="40,90 100,118 160,90 160,106 100,136 40,106" fill="#05040a"/>
  <polyline points="50,98 100,122 150,98" fill="none" stroke="#00d4ff" stroke-width="5" filter="url(#s42-glow)"/>
  <polyline points="50,98 100,122 150,98" fill="none" stroke="#d6fbff" stroke-width="2"/>
</svg>
