{% comment %}
  Boot screen shown on the homepage only (moved out of _layouts/default.html).
{% endcomment %}
<style>
  #boot-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    /* animation: pulseBackground 1.7s ease-in-out infinite; */
    color: #00fff2;
    font-family: 'Orbitron', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    /*z-index: 9999;*/
    z-index: 2147483647;
    overflow: hidden;
    opacity: 1;
    visibility: visible;  /* L'élément est visible au début */
    transition: opacity 1.7s ease-out, visibility 0s 1.7s;  /* Transition d'opacité, visibilité après 1.7s */
  }

  #boot-screen.hidden {
    opacity: 0; /* Réduit l'opacité à 0 */
    visibility: hidden; /* Cache l'élément après le fondu */
  }

  #boot-screen::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at center, rgba(11, 15, 26, 0.7) 0%, rgba(0, 5, 16, 0.7) 80%),
              url('{{ "/assets/images/lines.jpg" | relative_url }}') center center / cover no-repeat;
  filter: blur(3px);
  -webkit-filter: blur(3px);
  z-index: -1;  /* Place the background behind the content */
  }

  #boot-text {
    font-size: 1.1rem;
    margin-bottom: 2rem;
    text-align: center;
    letter-spacing: 0.05em;
    font-weight: bold;
    z-index: 1;
  }

  .progress-bar-container {
    width: 60%;
    height: 10px;
    background-color: rgba(255, 255, 255, 0.1);
    border-radius: 5px;
    overflow: hidden;
    box-shadow: 0 0 10px #00fff2;
  }

  .progress-bar {
    width: 0%;
    height: 100%;
    background: linear-gradient(to right, #00fff2, #007a99);
    animation: loadBar 1.1s linear forwards;
  }

  @keyframes loadBar {
    to { width: 100%; }
  }
</style>
<div id="boot-screen">
  <div id="boot-text">INITIALIZING NEURAL UPLINK...</div>
    <div class="progress-bar-container">
      <div class="progress-bar"></div>
    </div>
  </div>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      document.getElementById('boot-screen').classList.add('hidden');
    }, 900); // l'ecran commence a disparaitre
    // Ajouter un délai pour la transition avant de cacher complètement l'élément
    setTimeout(() => {
      document.getElementById('boot-screen').style.display = 'none'; // Cache l'écran après 3.2s, une fois le fondu terminé
    }, 1200); // 2.1s pour laisser à l'animation d'opacité le temps de se faire
});
</script>
